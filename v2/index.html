<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QolJetim AI — Бір сабақ — әр балаға тең мүмкіндік</title>
<meta name="description" content="QolJetim AI — ЕББҚ оқушысының тапсырмасын бейімдеуге және ортақ ҚМЖ-ға кіріктіруге арналған тегін веб-платформа">
<style>
:root{
  --bg:#f3f8f6; --surface:#ffffff; --ink:#15302a; --muted:#5a6e69; --line:#d9e6e1;
  --green:#178a5e; --green-d:#0f6b48; --green-s:#e2f4ec;
  --blue:#2470c9; --blue-d:#1b5aa3; --blue-s:#e5effb;
  --warn:#9a5b00; --warn-s:#fff3dd; --err:#b3362b; --err-s:#fdecea; --ok:#147a4e; --ok-s:#dff5ea;
  --radius:16px; --shadow:0 2px 10px rgba(21,48,42,.06),0 1px 2px rgba(21,48,42,.05);
  --scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid #f0b400;outline-offset:2px;border-radius:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--green);color:#fff;min-height:44px;transition:background .15s,transform .05s;text-decoration:none}
.btn:hover{background:var(--green-d)}
.btn:active{transform:translateY(1px)}
.btn.blue{background:var(--blue)} .btn.blue:hover{background:var(--blue-d)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)} .btn.ghost:hover{background:#eef5f2}
.btn.soft{background:var(--green-s);color:var(--green-d)} .btn.soft:hover{background:#cfeedd}
.btn.danger{background:var(--surface);color:var(--err);border:1.5px solid #efc5c0}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.lg{padding:16px 26px;font-size:18px;border-radius:14px;min-height:56px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:20px;height:20px;flex:none}

/* layout */
.wrap{max-width:1120px;margin:0 auto;padding:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.card+.card{margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
h1,h2,h3{line-height:1.25;margin:0 0 10px}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.mt{margin-top:14px} .mt2{margin-top:24px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--blue-s);color:var(--blue-d)}
.tag.g{background:var(--green-s);color:var(--green-d)} .tag.w{background:var(--warn-s);color:var(--warn)} .tag.e{background:var(--err-s);color:var(--err)}
.note{border-radius:12px;padding:12px 14px;background:var(--blue-s);color:#163d6b;font-size:14.5px}
.note.w{background:var(--warn-s);color:#5f3a00} .note.e{background:var(--err-s);color:#7a1f17} .note.g{background:var(--ok-s);color:#0d5233}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px}
.logo{white-space:nowrap;flex:none;display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--ink);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;gap:7px;align-items:center}
.nav button svg{width:18px;height:18px}
.nav button:hover{background:#eef5f2;color:var(--ink)}
.nav button.on{background:var(--green-s);color:var(--green-d)}
@media(max-width:1440px){.top .wrap{flex-wrap:wrap}.nav{order:3;width:100%}}

/* landing */
.hero{min-height:calc(100vh - 0px);display:grid;place-items:center;padding:30px 18px;background:radial-gradient(1200px 500px at 10% -10%,#d8f1e5 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#dceafb 0,transparent 55%),var(--bg)}
.hero-in{max-width:920px;width:100%;text-align:center}
.hero .logo-mark{width:64px;height:64px;border-radius:18px;font-size:26px;margin:0 auto 14px}
.hero h1{font-size:46px;letter-spacing:-.5px;margin-bottom:6px}
.hero .slogan{font-size:21px;color:var(--green-d);font-weight:600;margin-bottom:30px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 auto;max-width:720px}
@media(max-width:640px){.roles{grid-template-columns:1fr}.hero h1{font-size:34px}}
.role{border:0;cursor:pointer;border-radius:20px;padding:28px 20px;color:#fff;text-align:center;box-shadow:0 8px 24px rgba(21,48,42,.12);transition:transform .12s}
.role:hover{transform:translateY(-2px)}
.role svg{width:46px;height:46px;margin-bottom:10px}
.role b{display:block;font-size:21px}
.role span{display:block;opacity:.9;font-size:14.5px;margin-top:4px}
.role.t{background:linear-gradient(135deg,#178a5e,#11734d)} .role.s{background:linear-gradient(135deg,#2a7fd9,#1d5fae)}
.flow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:34px}
.flow span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.flow i{font-style:normal;color:var(--green);font-weight:800;align-self:center}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}

/* stepper */
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;counter-reset:s}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fbfdfc;font-size:14px;position:relative}
.step b{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.step.done{border-color:#9fd8bd;background:var(--green-s)}
.step.done b{color:var(--green-d)}
.step.cur{border-color:var(--blue);background:var(--blue-s)}

/* forms */
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
.inp,textarea.inp,select.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;min-height:44px}
textarea.inp{min-height:90px;resize:vertical}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-s)}
.drop{border:2.5px dashed #a9cdbf;border-radius:18px;padding:30px;text-align:center;background:#f8fcfa;cursor:pointer;transition:background .15s}
.drop:hover,.drop.over{background:var(--green-s);border-color:var(--green)}
.drop svg{width:44px;height:44px;color:var(--green)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;background:#fff;font-weight:600;user-select:none;min-height:46px}
.chip input{width:20px;height:20px;accent-color:var(--green)}
.chip.on{border-color:var(--green);background:var(--green-s);color:var(--green-d)}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1.5fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cmp>div{padding:16px}
.cmp .src{background:#f7f9f8;border-right:1px solid var(--line)}
.cmp .ad{background:#fff}
.cmp h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.cmp .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.cmp ol{margin:6px 0 0;padding-left:20px}
@media(max-width:700px){.cmp{grid-template-columns:1fr}.cmp .src{border-right:0;border-bottom:1px solid var(--line)}}

/* plan table */
.plan{width:100%;border-collapse:collapse;font-size:14px}
.plan th,.plan td{border:1px solid var(--line);padding:9px;vertical-align:top;text-align:left}
.plan th{background:#eef5f2;font-size:13px}
.plan td.st{font-weight:700;width:120px}
.plan .pre{white-space:pre-wrap}
.sen{margin-top:10px;border:2px solid var(--green);background:var(--green-s);border-radius:12px;padding:12px;white-space:normal}
.sen h5{margin:0 0 6px;font-size:14.5px;color:var(--green-d)}
.sen dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.sen dt{font-weight:700}
.sen dd{margin:0}
.scroll{overflow-x:auto}
.pre{white-space:pre-wrap}
details summary{cursor:pointer;font-weight:600;color:var(--blue-d)}
.raw{max-height:300px;overflow:auto;background:#f7f9f8;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;margin-top:8px}

/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px}
.tbl th{color:var(--muted);font-size:13px;font-weight:600}

/* student */
.stu{max-width:820px}
.taskbox{font-size:calc(18px * var(--scale))}
.taskbox .expr{font-size:calc(44px * var(--scale));font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums;text-align:center;margin:10px 0 4px}
.taskbox .instr{font-size:calc(21px * var(--scale));font-weight:600;text-align:center}
.taskbox .explain{font-size:calc(17px * var(--scale));background:var(--blue-s);border-radius:12px;padding:12px 14px;margin-top:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:6px}
.tools .btn{min-width:52px}
.progress{height:12px;border-radius:999px;background:#e3ece8;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .3s}
.hint{background:#fffbea;border:1.5px solid #f2dc8b;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:calc(19px * var(--scale));font-weight:600;animation:pop .25s ease}
.hint small{display:block;font-size:12.5px;color:var(--warn);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.answer{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px}
.answer input{width:calc(160px * var(--scale));font-size:calc(34px * var(--scale));text-align:center;font-weight:800;border:2.5px solid var(--line);border-radius:14px;padding:6px;min-height:64px}
.answer input:focus{border-color:var(--blue);outline:none}
.answer label{font-size:calc(18px * var(--scale));font-weight:600}
.fb{margin-top:16px;border-radius:14px;padding:14px;text-align:center;font-size:calc(21px * var(--scale));font-weight:700;animation:pop .25s}
.fb.ok{background:var(--ok-s);color:var(--ok)} .fb.no{background:var(--warn-s);color:#6b4200}
.vis{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.grp{border:2px solid #b9d9f3;background:#f4f9fe;border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(4,12px);gap:4px;position:relative;cursor:default}
.grp i{width:12px;height:12px;border-radius:50%;background:var(--blue);display:block}
.grp em{position:absolute;top:-10px;right:-10px;background:var(--green);color:#fff;font-style:normal;font-weight:800;border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;animation:pop .2s}
.big-done{text-align:center}
.big-done .medal{width:90px;height:90px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--blue));color:#fff}
.big-done .medal svg{width:48px;height:48px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:#f7fbf9;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--green-d)}

/* toast */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#15302a;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:14.5px;animation:pop .2s;max-width:90vw}
.toast.err{background:var(--err)} .toast.ok{background:var(--green-d)}
@media print{.top,.no-print{display:none!important}}
.grid2>.card,.grid3>.card{margin-top:0}

/* ===== Демонстрацияға арналған көрнекілік жақсартулары (тек оқушы кабинеті) ===== */
.stu{max-width:880px}
.stu .muted,.stu .small{font-size:15.5px;color:#4a5e59}
.stuhead{margin-bottom:10px;align-items:baseline}
.pcount{font-size:22px;color:var(--green-d)}
.ptopic{font-size:15.5px;color:#4a5e59}
.stu .progress{height:16px;border:1px solid #cfe0d9}
.tools{gap:14px;margin-bottom:12px}
.fontctl{display:inline-flex;align-items:center;gap:14px;background:var(--green-s);border:1.5px solid #9fd8bd;border-radius:16px;padding:6px 10px}
.fbtn{min-width:52px;min-height:52px;border-radius:12px;border:1.5px solid #8fcfb0;background:#fff;color:var(--green-d);font-size:22px;font-weight:800;cursor:pointer;line-height:1;transition:background .15s}
.fbtn:hover{background:#d2efe1}
.fbtn:active{transform:translateY(1px)}
.flabel{font-size:18px;font-weight:700;color:#15302a;white-space:nowrap}
.btn.listen{min-height:56px;padding:12px 20px;font-size:18px;font-weight:700;border-radius:14px;background:var(--blue-s);color:#164c8a;border:1.5px solid #a9cbef}
.btn.listen:hover{background:#d5e6fa}
.btn.listen svg{width:24px;height:24px}
/* басқару батырмалары әріп өлшеміне қарамай тұрақты, анық өлшемде */
.taskbox .btn{font-size:17px;min-height:52px}
.taskbox .btn.lg{font-size:19px;min-height:60px}
.taskbox .btn.soft{border:1.5px solid #9fd8bd}
.taskbox .btn.soft:hover{background:#cfeedd}
.taskbox .btn.ghost.sm{font-size:15.5px;min-height:46px}
/* негізгі тапсырма — ең бірінші назар аударатын элемент */
.taskbox .expr{font-size:calc(48px * var(--scale));color:#0f2a24;margin:14px 0 6px}
.taskbox .note{font-size:15.5px}
@media(min-width:1600px){.stu{max-width:980px}.taskbox .expr{font-size:calc(58px * var(--scale))}}
@media(max-width:560px){.fontctl{gap:8px;padding:5px 8px}.flabel{font-size:16px}.btn.listen{width:100%}.taskbox .expr{font-size:calc(38px * var(--scale))}}
.top .btn.sm{min-height:44px}.top .logo{min-height:44px}

/* ===================== 2.0: жаңа бөліктер ===================== */
.err{color:var(--err)}
.linkbtn{background:none;border:0;color:var(--blue-d);text-decoration:underline;cursor:pointer;padding:4px;font:inherit;min-height:32px}
.dim{opacity:.6}
/* Басты бет */
.land-top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.land-top .wrap{padding-top:10px;padding-bottom:10px}
.hero2{background:radial-gradient(1100px 480px at 0% -10%,#d8f1e5 0,transparent 60%),radial-gradient(900px 480px at 110% 0%,#dceafb 0,transparent 55%),var(--bg);padding:48px 0 36px}
.hero-text{max-width:820px}
.hero2 h1{font-size:52px;letter-spacing:-.5px;margin:12px 0 4px}
.hero2 .slogan{font-size:22px;color:var(--green-d);font-weight:700;margin:0 0 12px}
.hero2 .lead{font-size:19px;max-width:720px;color:#2a433d}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 10px}
.sect{padding-top:26px;padding-bottom:10px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.feat .card svg{width:30px;height:30px;color:var(--green)}
.feat .card h3{margin-top:8px}
.feat .card p{margin:0;color:#3d5550;font-size:15px}
@media(max-width:980px){.feat{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.feat{grid-template-columns:1fr}.hero2 h1{font-size:38px}.hero-btns .btn{width:100%}}
.how{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;counter-reset:x}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative}
.how li b{position:absolute;top:10px;right:12px;font-size:28px;color:#cfe4dc}
.how li span svg{width:30px;height:30px;color:var(--blue)}
.how h4{margin:8px 0 4px;font-size:17px}
.how p{margin:0;font-size:14.5px;color:#3d5550}
@media(max-width:980px){.how{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.how{grid-template-columns:1fr}}
.fbcard{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,#e2f4ec,#e5effb)}
.foot2{color:var(--muted);font-size:13.5px;padding-top:24px;padding-bottom:90px}
/* Демо-сабақтар */
.demos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.demos{grid-template-columns:1fr}}
.demo{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px solid var(--line);background:#fbfdfc;border-radius:16px;padding:16px;cursor:pointer;min-height:44px}
.demo:hover{border-color:#9fd8bd;background:var(--green-s)}
.demo.on{border-color:var(--green);background:var(--green-s)}
.demo-i{font-size:30px}
.demo b{font-size:16.5px}
.demo small{color:var(--muted)}
/* Тапсырма редакторы */
.tcard{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:#fbfdfc}
.tcard.sel{border-color:#9fd8bd;background:#fff}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:700;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--green)}
.inp.sm{min-height:40px;padding:6px 10px;width:auto}
.optrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.optrow input[type=radio]{width:22px;height:22px;accent-color:var(--green);flex:none}
.cands{max-height:360px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:12px}
.cand{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.cand:last-child{border-bottom:0}
.cmp .srctxt{white-space:pre-wrap;font-size:15.5px}
.cmp .adinstr{font-size:17px;font-weight:700}
.opts{margin:6px 0 0;padding-left:22px}
.passage-s{background:#f7f9f8;border-radius:8px;padding:8px;margin:6px 0}
.sendopt{border:1.5px solid var(--line);border-radius:14px;padding:14px}
.sendopt h3{display:flex;gap:8px;align-items:center}
.sendopt h3 svg{width:20px;height:20px}
.linkbox input{font-size:13px}
/* Алдын ала қарау */
.pvbar{background:#fff4dd;border-bottom:1px solid #f0d9a8;color:#5f3a00}
.pvbar .wrap{padding-top:8px;padding-bottom:8px}
/* Оқушы: тапсырма түрлері */
.ttype{text-align:center;font-size:14px;font-weight:700;color:var(--blue-d);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.qtext{font-size:calc(22px * var(--scale));font-weight:800;text-align:center;margin:14px 0 4px}
.passage{font-size:calc(20px * var(--scale));line-height:1.75;background:#fffdf5;border:1.5px solid #eadfb8;border-radius:14px;padding:16px 18px;margin-top:12px}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;cursor:pointer;font-size:calc(20px * var(--scale));font-weight:600;min-height:56px;color:var(--ink)}
.choice:hover{border-color:#9fd8bd}
.choice.on{border-color:var(--green);background:var(--green-s);box-shadow:0 0 0 2px #9fd8bd inset}
.choice .cl{flex:none;width:38px;height:38px;border-radius:10px;background:var(--blue-s);color:var(--blue-d);display:grid;place-items:center;font-weight:800;font-size:18px}
.choice.on .cl{background:var(--green);color:#fff}
.choice.on::after{content:"✓ таңдалды";margin-left:auto;font-size:14px;color:var(--green-d)}
.choice[disabled]{cursor:default}
.matchrows{display:grid;gap:10px;margin-top:14px}
.mrow{display:grid;grid-template-columns:minmax(90px,1fr) auto minmax(140px,1.6fr) auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.mrow.bad{border-color:#e7b0a9;background:#fff7f5}
.ml{font-size:calc(19px * var(--scale));font-weight:700}
.msel{font-size:calc(18px * var(--scale));min-height:50px}
.mmark{font-weight:700;font-size:14px;min-width:24px}
@media(max-width:560px){.mrow{grid-template-columns:1fr}.mrow>span[aria-hidden]{display:none}}
.answer.txt input{width:min(100%,calc(380px * var(--scale)));font-size:calc(24px * var(--scale));text-align:left;font-weight:700}
.vistext{white-space:pre-wrap;text-align:center;font-size:calc(30px * var(--scale));line-height:1.6;background:#f4f9fe;border:2px solid #b9d9f3;border-radius:16px;padding:16px;margin-top:12px}
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;margin:10px auto 0}
.dot{width:26px;height:26px;border-radius:50%;display:inline-block;border:0;padding:0}
.dot.a{background:var(--blue)} .dot.b{background:var(--green)}
button.dot{cursor:pointer;min-width:26px}
button.dot.x{background:#c9d3d0;position:relative}
button.dot.x::after{content:"✕";color:#7a1f17;font-weight:800;position:absolute;inset:0;display:grid;place-items:center;font-size:16px}
.plus{font-size:26px;font-weight:800;align-self:center;padding:0 6px}
/* Контраст режимі */
body.hc{background:#000;color:#fff}
body.hc .top{background:#000;border-color:#fff}
body.hc .logo,body.hc .stu .muted,body.hc .stu .small,body.hc .ptopic{color:#fff}
body.hc .card,body.hc .taskbox{background:#000;border:2px solid #fff;box-shadow:none}
body.hc .expr,body.hc .instr,body.hc .qtext,body.hc .pcount,body.hc h1,body.hc h2{color:#ffeb3b}
body.hc .explain,body.hc .passage,body.hc .vistext,body.hc .hint,body.hc .note{background:#000;color:#fff;border:2px solid #ffeb3b}
body.hc .btn,body.hc .fbtn,body.hc .choice,body.hc .mrow,body.hc .inp,body.hc .answer input{background:#000;color:#fff;border:2px solid #fff}
body.hc .btn:hover,body.hc .fbtn:hover,body.hc .choice:hover{background:#222}
body.hc .choice.on{background:#003a8c;border-color:#ffeb3b}
body.hc .choice .cl{background:#fff;color:#000}
body.hc .fontctl{background:#000;border-color:#fff}
body.hc .flabel{color:#fff}
body.hc .fb.ok{background:#003d1f;color:#fff;border:2px solid #7CFC00}
body.hc .fb.no{background:#3d2a00;color:#fff;border:2px solid #ffeb3b}
body.hc .progress{background:#333;border-color:#fff}
body.hc .grp{background:#000;border-color:#fff}
body.hc .grp i,body.hc .dot.a{background:#ffeb3b}
body.hc .stat{background:#000;color:#fff;border-color:#fff}
body.hc .stat b{color:#ffeb3b}
body.hc .tag{background:#fff;color:#000}
/* Гид */
.tour{position:fixed;right:16px;bottom:16px;z-index:60;width:360px;max-width:calc(100vw - 24px);background:#fff;border:2px solid var(--green);border-radius:18px;box-shadow:0 12px 32px rgba(21,48,42,.22);color:var(--ink)}
.tour-h{display:flex;align-items:center}
.tour-toggle{flex:1;text-align:left;background:var(--green);color:#fff;border:0;border-radius:15px 0 0 15px;padding:12px 14px;font-weight:800;font-size:15.5px;cursor:pointer;min-height:48px}
.tour:not(.open) .tour-toggle{border-radius:15px 0 0 15px}
.tour-x{width:48px;min-height:48px;border:0;background:var(--green-d);color:#fff;font-size:24px;border-radius:0 15px 15px 0;cursor:pointer}
.tour.open .tour-toggle{border-radius:15px 0 0 0}.tour.open .tour-x{border-radius:0 15px 0 0}
.tour-b{padding:12px 14px;max-height:60vh;overflow:auto}
.tour-now{margin:0 0 10px;font-size:15.5px}
.tour-list{margin:12px 0 6px;padding-left:20px;font-size:13.5px;color:var(--muted)}
.tour-list li.d{color:var(--green-d)} .tour-list li.c{color:var(--ink);font-weight:700}
@media(max-width:560px){.tour{right:8px;left:8px;bottom:8px;width:auto}}
body.hc .tour{background:#000;color:#fff;border-color:#ffeb3b}
@media print{.tour,.pvbar{display:none!important}}
body.tour-on main,body.tour-on .foot2{padding-bottom:230px}
.tour-all summary{font-size:13.5px;margin-top:8px}
.tour-b{max-height:46vh}
.feat>.card,.grid2>.card{margin-top:0}

</style>

/* --- ҚМЖ мазмұнын анықтау --- */
const NUM = '(\\d{1,3}(?:[ \\u00a0\\u202f]\\d{3})+|\\d+)';
const DIV_RX = new RegExp('^\\s*(?:\\d+\\s*[\\).]\\s*)?' + NUM + '\\s*[:÷]\\s*' + NUM + '\\s*=\\s*(.*)$');
const ANY_EXPR_RX = /\d\s*[:÷×x*+−\-]\s*\d.*=/;
const SEN_RX = /(ЕББҚ|ЕБҚЕО|ЕБҚ|ЕББ|ерекше\s+білім)/i;
const TASK_HEAD_RX = /^\s*(\d+\s*[А-ЯӘІҢҒҮҰҚӨҺа-яәіңғүұқөһ]?\s*[-–]\s*есеп|саралау\s+тапсырма)/i;

function parseLesson(blocks, fileName) {
  const L = { fileName, source: 'docx', section: '', topic: '', objectives: '', lessonGoal: '', grade: '', gradeNote: '', subject: '', subjectNote: '',
    stages: [], mainTasks: [], senTasks: [], candidates: [], senLines: [], senFound: false, senLabel: '', senStage: '', rawText: '' };
  const lines = [];
  for (const b of blocks) { if (b.type === 'p') lines.push(b.text); else for (const r of b.rows) for (const c of r) if (!c.cont && c.text.trim()) lines.push(c.text); }

  const rules = [['topic', /тақырыб/i], ['objectives', /(оқыту|оқу)\s+мақсат/i], ['lessonGoal', /сабақтың\s+мақсат/i], ['section', /^\s*бөлім/i], ['grade', /^\s*сынып/i], ['subject', /^\s*пән\b/i]];
  let stageTable = null, headerIdx = -1;
  for (const b of blocks) {
    if (b.type === 'p') {
      const m = b.text.match(/^\s*(сынып|пән|сабақтың тақырыбы|тақырыбы)\s*[:：]\s*(.+)$/i);
      if (m) { const k = /сынып/i.test(m[1]) ? 'grade' : /пән/i.test(m[1]) ? 'subject' : 'topic'; if (!L[k]) L[k] = m[2].trim(); }
      continue;
    }
    b.rows.forEach((r, ri) => {
      const cells = r.filter(c => !c.cont && c.text.trim());
      const t = cells.map(c => c.text);
      if (headerIdx < 0 && t.some(x => /(педагог|мұғалім)/i.test(x)) && t.some(x => /оқушы/i.test(x)) && cells.length >= 3) { stageTable = b; headerIdx = ri; return; }
      if (stageTable === b && headerIdx >= 0) return;

        const label = cells[0].text.trim();
        if (label.length > 80) return;

        const m = cells[0].text.match(/^\s*(сынып|пән)\s*[:：]\s*(.+)$/i);

    const hdr = stageTable.rows[headerIdx].filter(c => !c.cont);

        if (!line && !L.senTasks.length) continue;

      }
      if (TASK_HEAD_RX.test(line)) { cur = { title: line.replace(/\s+/g, ' '), stage: stageName, examples: [] }; L.mainTasks.push(cur); continue; }
      if (cur && (m || ANY_EXPR_RX.test(line)) && cur.examples.length < 6) cur.examples.push(line);
    }
  };
  if (L.stages.length) L.stages.forEach((s, i) => scan(s.teacher + '\n' + s.student, s.name, i)); else scan(L.rawText, '', -1);

  else {
    const m1 = L.rawText.match(/(\d{1,2})\s*[-–]?\s*сынып/i);

    else if (m2 && +m2[1] >= 1 && +m2[1] <= 11) { L.grade = m2[1]; L.gradeNote = `Оқу мақсатының кодынан анықталды (${(L.objectives.match(/\d+\.\d+\.\d+\.\d+/) || [''])[0]}) — тексеріңіз`; }

    const kw = (L.topic + ' ' + L.objectives + ' ' + L.rawText.slice(0, 4000)).match(/бөлу|көбейт|қосу|азайт|сандар|бөлінді|бөлгіш|теңдеу|өрнек/gi) || [];

  return L;
}

/* --- Өрнекті талдау: 120 : 12, 25 + 17, 300 − 45, 12 × 4 --- */

function validateTask(t) {

  if (t.type === 'choice') {
    if (!t.question.trim()) return 'Сұрақты жазыңыз.';
    const opts = t.options.map(x => x.trim());
    if (opts.filter(Boolean).length < 2) return 'Кемінде екі жауап нұсқасын жазыңыз.';
    if (!opts[t.correct]) return 'Дұрыс жауапты белгілеңіз.';

  if (t.type === 'match') return `${t.question || 'Сәйкестендір.'} ${t.pairs.filter(p => p[0] && p[1]).map(p => `${p[0]} → ${p[1]}`).join('; ')}`;

/* Детерминирленген араластыру (сәйкестендіру үшін) */
function seededShuffle(arr, seed) {
  let h = 2166136261; for (const ch of String(seed)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }

/* --- Жауапты тексеру --- */
function checkAnswer(it, ans) {
  const type = it.type || 'calc';
  if (type === 'calc') {
    const v = toInt(ans.value), rv = it.remainder ? toInt(ans.rem) : 0;
    if (isNaN(v) || (it.remainder && isNaN(rv))) return { status: 'invalid' };
    return { status: v === it.answer && rv === (it.remainder || 0) ? 'ok' : 'no', v };
  }
  if (type === 'choice') { if (ans.choice == null) return { status: 'invalid' }; return { status: ans.choice === it.correctIdx ? 'ok' : 'no' }; }
  if (type === 'match') {
    if (ans.match.some(x => !x)) return { status: 'invalid' };
    const marks = ans.match.map((x, i) => x === it.rightAns[i]);
    return { status: marks.every(Boolean) ? 'ok' : 'no', marks, right: marks.filter(Boolean).length };
  }
  const txt = norm(ans.text); if (!txt) return { status: 'invalid' };
  if (!it.autoCheck) return { status: 'pending' };
  const ok = it.answers.some(a => norm(a) === txt) || (it.keywords.length && it.keywords.every(k => txt.includes(norm(k))));
  return { status: ok ? 'ok' : 'no' };
}

  L.tasks = L.tasks.map(t => newTask(t.type, { ...t, origin: 'demo', stageIdx: L.senStageIdx }));
  return L;
}
/* Құжаттан табылған ЕББҚ тапсырмаларын тапсырма тізіміне айналдыру */
function finalizeLesson(L) {
  if (!L.tasks) {
    L.tasks = (L.senTasks || []).map(t => newTask('calc', { expr: `${t.a} : ${t.b}`, origin: 'doc', stageIdx: L.senStageIdx }));
    // Бөлу емес, бірақ ЕББҚ белгісінен кейін тұрған жолдарды да ұсынамыз (таңдалмаған күйде)
    (L.senLines || []).forEach(x => L.tasks.push({ ...taskFromLine(x.text, x.stageIdx), selected: false }));
  }
  L.tasks.forEach(t => { if (t.type === 'calc') t.id = taskId(t); });
  return L;
}
/* Ескі нұсқадағы деректерді жаңа модельге көшіру */
function migrateLesson(L) {
  if (!L) return L;
  if (!L.candidates) L.candidates = [];
  if (!L.tasks) finalizeLesson(L);
  return L;
}

/* =====================================================================
   Дыбыстау (Web Speech API) — тек қазақ дауысы болса
   ===================================================================== */
const TTS = {
  voice: null, total: 0, api: 'speechSynthesis' in window,
  init() { if (!this.api) return; const pick = () => { const vs = speechSynthesis.getVoices(); this.total = vs.length;
    this.voice = vs.find(v => /^kk/i.test(v.lang)) || vs.find(v => /kazakh|қазақ/i.test(v.name)) || null; }; pick(); speechSynthesis.onvoiceschanged = pick; },
  sayable(t) { return String(t).replace(/\u00a0/g, '').replace(/(\d)\s*[:÷]\s*(?=\d)/g, '$1 бөлу ').replace(/(\d)\s*[×x*]\s*(?=\d)/g, '$1 көбейту ').replace(/(\d)\s*[−-]\s*(?=\d)/g, '$1 азайту ').replace(/(\d)\s*\+\s*(?=\d)/g, '$1 қосу ').replace(/=\s*\?/g, ' нешеге тең').replace(/=/g, ' тең ').replace(/\?/g, '?'); },
  speak(text, onStatus) {
    if (!this.api) return 'Бұл браузерде дыбыстау функциясы жоқ.';
    if (!this.voice) { const vs = speechSynthesis.getVoices(); this.voice = vs.find(v => /^kk/i.test(v.lang)) || vs.find(v => /kazakh|қазақ/i.test(v.name)) || null; }
    if (!this.voice) return 'Бұл құрылғыда қазақ тілді дауыс табылмады, сондықтан мәтін дыбысталмайды. Басқа тілдегі дауысты қазақша дыбыстау ретінде ұсынбаймыз. Қазақ дауысы бар браузерді (мысалы, интернетке қосылған Microsoft Edge) қолданыңыз немесе мұғалім оқып берсін.';
    // Chromium/Edge: cancel() мен speak() бірден қатар шақырылса, сөйлеу кейде үнсіз жоғалады — сондықтан аз кідіріс.
    // Utterance жаһандық айнымалыда сақталады, әйтпесе браузер оны ортасында тоқтатып тастауы мүмкін.
    const say = () => {
      const u = new SpeechSynthesisUtterance(this.sayable(text)); this.cur = u; let started = false;
      u.voice = this.voice; u.lang = this.voice.lang; u.rate = 0.9;
      u.onstart = () => { started = true; onStatus && onStatus('playing'); };
      u.onend = () => { if (this.cur === u) onStatus && onStatus('end'); };
      u.onerror = e => { if (e.error === 'interrupted' || e.error === 'canceled') return; onStatus && onStatus('error', e.error); };
      if (speechSynthesis.paused) speechSynthesis.resume();
      speechSynthesis.speak(u);
      setTimeout(() => { if (!started && this.cur === u) onStatus && onStatus('nostart'); }, 5000);
    };
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(say, 200); } else say();
    onStatus && onStatus('wait');
    return '';
  },
  status() { if (!this.api) return { ok: false, text: 'Браузерде дыбыстау API жоқ' }; return this.voice ? { ok: true, text: `Қазақ дауысы бар: ${this.voice.name}` } : { ok: false, text: 'Осы браузерде қазақ дауысы табылмады — оқушыға шынайы ескерту көрсетіледі. Microsoft Edge-ті интернетпен ашып көріңіз.' }; }
};

/* Сілтеме арқылы беру: деректер сығылып, сілтеменің ішіне жазылады (сервер жоқ) */
async function packData(obj) {
  const json = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === 'undefined') return 'j' + bufToB64(json.buffer).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
  return 'z' + bufToB64(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function unpackData(s) {
  const kind = s[0]; let b = s.slice(1).replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
  const buf = b64ToBuf(b);
  if (kind === 'j') return JSON.parse(new TextDecoder().decode(buf));
  const txt = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  return JSON.parse(txt);
}

function bindUpload() {

  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; await handleBuffer(await f.arrayBuffer(), f.name); inp.value = ''; };
  drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', async e => { const f = e.dataTransfer.files[0]; if (f) await handleBuffer(await f.arrayBuffer(), f.name); });

function bindEditor() {
  const L = state.lessonPreview; if (!L) return;
  const rerender = () => { const y = window.scrollY; $('#parsed').innerHTML = lessonEditor(L); bindEditor(); window.scrollTo(0, y); };
  const box = $('#parsed');
  box.oninput = e => {
    const el = e.target; const i = el.dataset.t; if (i == null) return; const t = L.tasks[+i];
    if (el.dataset.f) { t[el.dataset.f] = el.value; if (el.dataset.f === 'expr') { const p = parseExpr(el.value); const c = $(`[data-calc="${i}"]`); if (c) { c.className = 'small ' + (p ? 'muted' : 'err'); c.textContent = p ? `Дұрыс жауап: ${fmt(p.answer)}${p.remainder ? ` (қалдық ${p.remainder})` : ''}` : 'Өрнекті екі сан және бір амал түрінде жазыңыз.'; } } }
    if (el.dataset.opt != null) t.options[+el.dataset.opt] = el.value;
    if (el.dataset.pair) { const [j, k] = el.dataset.pair.split(':'); t.pairs[+j][+k] = el.value; }
    if (el.dataset.list) t[el.dataset.list] = el.value.split(',').map(x => x.trim()).filter(Boolean);
    if (el.dataset.lines) t[el.dataset.lines] = el.value.split('\n').map(x => x.trim()).filter(Boolean);
  };
  box.onchange = e => {
    const el = e.target; const i = el.dataset.t;
    if (el.id === 'candQ') return;
    if (i == null) return; const t = L.tasks[+i];
    if (el.dataset.sel != null) { t.selected = el.checked; rerender(); }
    if (el.dataset.corr != null) t.correct = +el.dataset.corr;
    if (el.dataset.type != null) { const q = t.question || (t.type === 'calc' ? t.expr : ''); const nt = newTask(el.value, { id: t.id, origin: t.origin, stageIdx: t.stageIdx, question: el.value === 'calc' ? '' : q, visual: t.visual, steps: t.steps, simple: t.simple }); if (el.value === 'calc' && parseExpr(q)) nt.expr = parseExpr(q).expr; L.tasks[+i] = nt; rerender(); }
  };
  box.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const ds = b.dataset;
    if (ds.del != null) { if (confirm('Тапсырма өшірілсін бе?')) { L.tasks.splice(+ds.del, 1); rerender(); } }
    else if (ds.addopt != null) { L.tasks[+ds.addopt].options.push(''); rerender(); }
    else if (ds.delopt) { const [i, j] = ds.delopt.split(':').map(Number); const t = L.tasks[i]; t.options.splice(j, 1); if (t.correct >= t.options.length || t.correct === j) t.correct = 0; else if (t.correct > j) t.correct--; rerender(); }
    else if (ds.addpair != null) { L.tasks[+ds.addpair].pairs.push(['', '']); rerender(); }
    else if (ds.delpair) { const [i, j] = ds.delpair.split(':').map(Number); L.tasks[i].pairs.splice(j, 1); rerender(); }
    else if (ds.cand != null) { const c = L.candidates[+ds.cand]; L.tasks.push(taskFromLine(c.text, c.stageIdx)); rerender(); toast('Тапсырма қосылды. Түрі мен мәтінін тексеріңіз.', 'ok'); setTimeout(() => $(`#tc${L.tasks.length - 1}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); }
    else if (b.id === 'addTask') { L.tasks.push(newTask($('#newType').value, { stageIdx: L.senStageIdx })); rerender(); setTimeout(() => $(`#tc${L.tasks.length - 1}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); }
    else if (b.id === 'saveLesson') saveLesson();
  };
  const cq = $('#candQ'); if (cq) cq.oninput = () => { state.candFilter = cq.value; $('#cands').innerHTML = candList(L); };
}
function saveLesson() {

  const bad = L.tasks.map((t, i) => [t, i]).filter(([t]) => t.selected && validateTask(t));
  if (bad.length) { msg.innerHTML = `<div class="note e mt">${bad.map(([t, i]) => `${i + 1}-тапсырма: ${esc(validateTask(t))}`).join('<br>')}</div>`; $(`#tc${bad[0][1]}`).scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  L.tasks.forEach(t => { if (t.type === 'calc') { const p = parseExpr(t.expr); if (p) t.expr = p.expr; t.id = taskId(t); } if (t.type === 'choice') { const keep = t.options.map((o, j) => [o.trim(), j]).filter(x => x[0]); t.correct = Math.max(0, keep.findIndex(x => x[1] === t.correct)); t.options = keep.map(x => x[0]); } if (t.type === 'match') t.pairs = t.pairs.filter(p => p[0].trim() && p[1].trim()); });
  const ids = new Set(); L.tasks.forEach(t => { if (ids.has(t.id)) t.id = t.id + '_' + uid().slice(0, 3); ids.add(t.id); });

const xesc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function wPara(runs, o = {}) {
  const box = o.box !== false;
  const pPr = (box ? `<w:pBdr>${['top', 'left', 'bottom', 'right'].map(s => `<w:${s} w:val="single" w:sz="12" w:space="4" w:color="178A5E"/>`).join('')}</w:pBdr><w:shd w:val="clear" w:color="auto" w:fill="${o.head ? 'CDEBDD' : 'EEF8F3'}"/>` : '') + `<w:spacing w:before="${o.head ? 160 : 0}" w:after="${o.gap ? 80 : 20}" w:line="264" w:lineRule="auto"/>`;
  return `<w:p><w:pPr>${pPr}</w:pPr>${runs.map(([text, st = {}]) => { const rp = (st.b || o.head ? '<w:b/>' : '') + (o.head || st.color ? `<w:color w:val="${o.head ? '0F6B48' : st.color}"/>` : '') + (o.head ? '<w:sz w:val="26"/>' : o.size ? `<w:sz w:val="${o.size}"/>` : '');
    return `<w:r>${rp ? `<w:rPr>${rp}</w:rPr>` : ''}<w:t xml:space="preserve">${xesc(String(text).replace(/ /g, ' '))}</w:t></w:r>`; }).join('')}</w:p>`;
}
function senBlockXml(d, items) {
  const S = d.supports || {}; const L2 = (l, v) => wPara([[l + ' ', { b: true }], [v]], { gap: true });
  let x = wPara([['ЕББҚ оқушысына арналған бейімделген тапсырма']], { head: true });
  x += wPara([[d.approved ? '✓ Мұғалім тексеріп, бекітті' : 'Жоба: мұғалім әлі бекітпеген', { color: d.approved ? '0F6B48' : '9A5B00', b: true }]], { gap: true });
  x += wPara([['Қолдау тәсілдері: ', { b: true }], [SUPPORTS.filter(([k]) => S[k]).map(([, t]) => t).join(', ') || '—']], { gap: true });
  items.forEach((it, i) => {
    x += wPara([[`${i + 1}) Бастапқы тапсырма (${TYPES[it.type]}): `, { b: true }], [it.label]], {});
    x += wPara([['      Бейімделген нұсқаулық: ', { b: true }], [it.instruction]], {});
    if (it.explain) x += wPara([['      ' + it.explain]], {});
    if (it.passage) x += wPara([['      Мәтін: ', { b: true }], [it.passage]], {});
    if (it.type === 'choice') x += wPara([['      Нұсқалар: ', { b: true }], [it.options.map((o, j) => `${j + 1}) ${o}`).join('   ')]], {});
    if (it.type === 'match') x += wPara([['      Жұптар: ', { b: true }], [it.left.map((l, j) => `${l} → ${it.rightAns[j]}`).join(';   ')]], {});
    it.hints.forEach((h, j) => { x += wPara([[`      ${j + 1}-қадам: `, { b: true }], [h]], {}); });
    if (it.visual && it.visual.kind === 'text') x += wPara([['      Көрнекі көмек: ', { b: true }], [it.visual.text.replace(/\n/g, '  ')]], {});
    x += wPara([['      Сұрақ: ', { b: true }], [it.question]], { gap: true });
  });
  x += L2('Орындау тәсілі:', draftMethod(d)); x += L2('Бағалау критерийі:', draftCriterion(d));
  x += wPara([['Ескерту: ұсыныс QolJetim AI ережеге негізделген алгоритмі арқылы жасалды (тілдік модель емес); соңғы шешімді мұғалім қабылдайды.', { color: '5A6E69' }]], {});

}
function downloadBlob(blob, name) {

async function exportWord(L, d) {
  const items = draftItems(L, d); const block = senBlockXml(d, items);

  let blob;

    const entries = unzipEntries(b64ToBuf(L.docxB64)); const de = entries.find(e => e.name === 'word/document.xml');
    const doc = new DOMParser().parseFromString(new TextDecoder().decode(await inflateEntry(de)), 'application/xml');
    const frag = new DOMParser().parseFromString(`<w:root xmlns:w="${W_NS}">${block}</w:root>`, 'application/xml').documentElement;
    const nodes = [...frag.childNodes].filter(n => n.nodeType === 1).map(n => doc.importNode(n, true));
    const ps = [...doc.getElementsByTagNameNS(W_NS, 'p')];
    let anchor = null; const mi = ps.findIndex(p => SEN_RX.test(pText(p)) && pText(p).length < 80);
    if (mi >= 0) { anchor = ps[mi]; let n = anchor.nextSibling; while (n) { if (n.nodeType === 1 && n.localName === 'p') { const t = pText(n).trim(); if (DIV_RX.test(t) || !t) { if (t) anchor = n; n = n.nextSibling; continue; } } break; } }
    else {
      // Белгі жоқ болса: таңдалған кезеңнің педагог ұяшығының соңына
      const idx = d.stageIdx ?? L.senStageIdx; const st = L.stages[idx];
      if (st) { const key = (st.teacher.split('\n').find(x => x.trim().length > 5) || '').trim().slice(0, 30); const hit = key && ps.find(p => pText(p).includes(key)); if (hit) { const tc = hit.parentNode; const lastP = [...tc.childNodes].filter(n => n.nodeType === 1 && n.localName === 'p').pop(); anchor = lastP; } }
    }
    if (anchor) { let ref = anchor; for (const n of nodes) { ref.parentNode.insertBefore(n, ref.nextSibling); ref = n; } }
    else { const body = doc.getElementsByTagNameNS(W_NS, 'body')[0]; const sect = kids(body, 'sectPr')[0]; for (const n of nodes) body.insertBefore(n, sect || null); }
    let out = new XMLSerializer().serializeToString(doc); if (!out.startsWith('<?xml')) out = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' + out;
    const data = new TextEncoder().encode(out);
    blob = zipBuild(entries.map(e => e.name === 'word/document.xml' ? { name: e.name, method: 0, crc: crc32(data), usize: data.length, data, time: e.time, date: e.date } : { name: e.name, method: e.method, crc: e.crc, usize: e.usize, data: e.raw, time: e.time, date: e.date }), DOCX);
  } else {
    const P = (t, o) => String(t || '').split('\n').map(line => wPara([[line]], { box: false, ...o })).join('') || wPara([['']], { box: false });
    const cell = (inner, w) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="pct"/></w:tcPr>${inner}</w:tc>`;
    const idx = d.stageIdx ?? L.senStageIdx ?? 0;
    const head = `<w:tr>${['Кезең / уақыт', 'Педагогтің әрекеті', 'Оқушының әрекеті', 'Бағалау', 'Ресурстар'].map((h, i) => cell(wPara([[h, { b: true }]], { box: false }), [700, 1800, 1000, 800, 700][i])).join('')}</w:tr>`;
    const rows = L.stages.map((s, i) => `<w:tr>${cell(P(s.name + '\n' + s.time), 700)}${cell(P(s.teacher) + (i === idx ? block : ''), 1800)}${cell(P(s.student), 1000)}${cell(P(s.assessment), 800)}${cell(P(s.resources), 700)}</w:tr>`).join('');
    const tbl = L.stages.length ? `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="999999"/>`).join('')}</w:tblBorders></w:tblPr><w:tblGrid>${[1400, 3600, 2000, 1600, 1400].map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${head}${rows}</w:tbl>` : block;
    const body = wPara([[`Қысқа мерзімді жоспар: ${L.subject || ''} ${L.grade ? L.grade + '-сынып' : ''}`]], { box: false, size: 28 }) + wPara([['Тақырып: ', { b: true }], [L.topic]], { box: false }) + (L.objectives ? wPara([['Оқу мақсаты: ', { b: true }], [L.objectives]], { box: false, gap: true }) : '') + tbl + '<w:p/>';

    } else {
      let extra = '';
      if (it.type === 'calc' && r.v > 0) {
        if (it.op === ':') { const prod = r.v * it.b; const big = prod > it.a, small = it.a - prod >= it.b; if (big || small) extra = `Тексеріп көр: ${fmt(r.v)} × ${fmt(it.b)} = ${fmt(prod)}. Бұл ${abl(it.a)} ${big ? 'көп, кішірек' : 'аз, үлкенірек'} сан керек.`; }
        else extra = `Жауабың дұрыс жауаптан ${r.v > it.answer ? 'үлкен' : 'кіші'}. Қайта есептеп көр.`;
      }
      if (it.type === 'match') { r.marks.forEach((ok, j) => { $(`#mm${j}`).textContent = ok ? '✓ дұрыс' : '✗ қайта таңда'; $(`#mr${j}`).classList.toggle('bad', !ok); }); extra = `${r.marks.length} жұптың ${r.right}-і дұрыс.`; }
      $('#fb').innerHTML = fbHtml('no', extra);
      if (it.hints.length && P.hints < it.hints.length) { $('#fb').insertAdjacentHTML('beforeend', `<div class="row mt" style="justify-content:center"><button class="btn soft sm" id="helpBtn">${icon('bulb')}Көмек алу</button></div>`); $('#helpBtn').onclick = () => $('#nextHint').click(); }
      $('#ans')?.select?.();
    }
    $('#navRow').innerHTML = navButtons(); bindNav();
  };
  bindNav();
}
function bindNav() {
  const R = state.run;
  const nextT = () => { R.idx++; R.visOpen = false; renderTask(); window.scrollTo(0, 0); };
  $('#nextTask') && ($('#nextTask').onclick = nextT);
  $('#skipTask') && ($('#skipTask').onclick = nextT);
  $('#finish') && ($('#finish').onclick = finishRun);
}
function showVisual(open) {
  const R = state.run, it = R.asg.items[R.idx]; R.visOpen = open; const box = $('#vis');
  if (!open) { box.innerHTML = ''; return; }
  R.per[R.idx].visual = true; const v = it.visual; if (!v) return;
  if (v.kind === 'text') { box.innerHTML = `<div class="vistext">${esc(v.text)}</div>`; return; }
  if (v.kind === 'dots') {
    const dot = c => `<i class="dot ${c}"></i>`;
    box.innerHTML = v.op === '+' ? `<p style="text-align:center" class="mt">${fmt(v.a)} көк нүкте және ${fmt(v.b)} жасыл нүкте. Барлығын санап көр.</p><div class="dots">${dot('a').repeat(v.a)}<span class="plus">+</span>${dot('b').repeat(v.b)}</div>`
      : `<p style="text-align:center" class="mt">${fmt(v.a)} нүкте бар. ${fmt(v.b)} нүктені басып, сызып таста. Қаншасы қалды?</p><div class="dots" id="dotsBox">${Array.from({ length: v.a }, (_, i) => `<button class="dot a" aria-label="${i + 1}-нүкте" data-dot></button>`).join('')}</div><p class="small muted" style="text-align:center" id="dotCnt"></p>`;
    $$('[data-dot]').forEach(d => d.onclick = () => { d.classList.toggle('x'); $('#dotCnt').textContent = `Сызылғаны: ${$$('[data-dot].x').length}`; });
    return;
  }
  const { groups, per } = v;
  box.innerHTML = `<p style="text-align:center" class="mt">Барлығы <b>${fmt(v.total || it.a)}</b> шеңбер. Әр топта <b>${per}</b> шеңбер. Неше топ бар? Санап көр.</p>
   <div class="vis" aria-label="Әр топта ${per} шеңбер">${Array.from({ length: groups }, () => `<div class="grp">${'<i></i>'.repeat(per)}</div>`).join('')}</div>
   <p class="small muted" style="text-align:center">Әр топты басып, өзің сана.</p><div class="row mt" style="justify-content:center"><button class="btn ghost sm" id="countBtn">Санауды қайта бастау</button></div>`;
  let cnt = 0;
  $$('.grp').forEach(g => { g.style.cursor = 'pointer'; g.setAttribute('role', 'button'); g.tabIndex = 0;
    const mark = () => { if (g.querySelector('em')) return; cnt++; g.insertAdjacentHTML('beforeend', `<em>${cnt}</em>`); };
    g.onclick = mark; g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); mark(); } }; });
  $('#countBtn').onclick = () => { cnt = 0; $$('.grp em').forEach(x => x.remove()); };
}
function finishRun() {
  const R = state.run, asg = R.asg; R.finished = true;
  const rec = { id: uid(), studentId: R.sid, studentName: studentName(R.sid), assignmentId: asg.id, subject: asg.subject, topic: asg.topic, finishedAt: Date.now(), supports: asg.supports, tools: [...R.tools], preview: R.preview,
    total: asg.items.length, firstTry: R.per.filter(p => p.firstTry).length, hints: R.per.reduce((s, p) => s + p.hints, 0),
    items: asg.items.map((it, i) => ({ original: it.label, type: it.type, correct: R.per[i].correct, pending: R.per[i].pending, answered: R.per[i].solved, attempts: R.per[i].attempts, hints: R.per[i].hints, visual: R.per[i].visual, answer: R.per[i].answer || '' })) };
  recount(rec);
  if (!R.preview) { const all = Store.get('results', []); all.push(rec); Store.set('results', all); }
  R.result = rec;
  if (R.preview) { renderDone(); return; }
  go('/s/done');
}
function renderDone() {
  const R = state.run, r = R.result;
  $('#app').innerHTML = studentShell(`<section class="card big-done mt"><div class="medal">${icon('star')}</div><h1>Тапсырмалар орындалды!</h1>
    <p class="muted" style="font-size:18px">${r.done === r.total ? 'Сен барлық тапсырманы орындадың. Жарайсың!' : 'Сен жақсы жұмыс істедің! Қалған тапсырманы мұғаліммен бірге орындаймыз.'}</p>
    <div class="stats"><div class="stat"><b>${r.done}/${r.total}</b>орындалған тапсырма</div><div class="stat"><b>${r.correct}</b>дұрыс жауап</div><div class="stat"><b>${r.hints}</b>қолданылған көмек</div></div>
    ${R.preview ? '<p class="muted small mt">Бұл алдын ала қарау еді, нәтиже сақталмады.</p><div class="row mt" style="justify-content:center"><button class="btn lg" data-go="/t/adapt">' + icon('left') + 'Мұғалім кабинетіне оралу</button></div>'
      : R.viaLink ? `<div class="note mt" style="text-align:left"><b>Нәтижені мұғалімге жібер.</b> Төмендегі сілтемені көшіріп, мұғаліміңе жібер.<div id="retBox" class="mt">Сілтеме жасалып жатыр…</div></div>`
      : '<p class="muted small mt">Нәтиже мұғалімге жіберілді.</p>'}
    ${!R.preview ? `<div class="row mt" style="justify-content:center"><button class="btn lg ${R.viaLink ? 'ghost' : ''}" data-go="/s/home">${icon('home')}Басты бетке</button></div>` : ''}
    ${FEEDBACK_URL && !R.viaLink ? `<p class="mt"><a class="btn soft" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener" data-fb="1">${icon('star')}Мұғалім ретінде пікір қалдыру</a></p>` : ''}</section>`, null);
  if (R.viaLink) packData(r).then(p => { const url = baseUrl() + '#/t/import/' + p; $('#retBox').innerHTML = `<input class="inp" readonly value="${esc(url)}" aria-label="Нәтиже сілтемесі"><div class="row mt"><button class="btn" id="retCopy">${icon('check')}Сілтемені көшіру</button>${navigator.share ? `<button class="btn ghost" id="retShare">${icon('send')}Бөлісу</button>` : ''}</div>`;
    $('#retCopy').onclick = async () => toast(await copyText(url) ? 'Көшірілді. Енді мұғаліміңе жібер.' : 'Көшіру мүмкін болмады, сілтемені қолмен белгілеп ал', 'ok');
    $('#retShare') && ($('#retShare').onclick = () => navigator.share({ title: 'QolJetim AI нәтиже', url }).catch(() => { })); });
}

/* ---------------- Іске қосу ---------------- */
TTS.init();
render();

</script>
